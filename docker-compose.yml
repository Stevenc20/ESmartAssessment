services:
  app:
    build: .
    container_name: esmart-app
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      - mysql
    environment:
      - APP_URL=https://esmart.tantechstev.com
      - ASSET_URL=https://esmart.tantechstev.com
      - SESSION_SECURE_COOKIE=true
    networks:
      - esmart
    ports:
      - "8002:80"
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
      - ./nginx/default.conf:/etc/nginx/sites-available/default:ro
      - ./php-fpm-www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro

  peerjs:
    image: peerjs/peerjs-server:latest
    container_name: esmart-peerjs
    restart: unless-stopped
    command: ["--port", "9000", "--path", "/peerjs", "--key", "peerjs", "--proxied"]
    networks:
      - esmart

  coturn:
    image: coturn/coturn:latest
    container_name: esmart-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49152
      - --max-port=65535
      - --realm=esmart.tantechstev.com
      - --lt-cred-mech
      - --user=esmart:${TURN_PASSWORD:-CHANGE_ME_TURN_PASSWORD}
      - --fingerprint
      - --no-multicast-peers

  mysql:
    image: mysql:8.0
    container_name: esmart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-esmart}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-esmart}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - esmart

volumes:
  storage:
  mysql:

networks:
  esmart:
    driver: bridge
